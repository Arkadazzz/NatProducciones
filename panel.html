<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control | Nat Producciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif; }
        .navbar { background-color: #141414; border-bottom: 1px solid #2a2a2a; }
        .card-panel { background: #141414; border-radius: 15px; border: 1px solid #2a2a2a; padding: 25px; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(138, 43, 226, 0.1); }
        h4, h5 { color: #b066ff; font-weight: 600; }
        .form-control { background-color: #222222; border: 1px solid #333333; color: #ffffff; border-radius: 8px; }
        .form-control:focus { border-color: #b066ff; background-color: #222222; color: #ffffff; box-shadow: none; }
        .btn-custom { background: linear-gradient(135deg, #7b2cbf, #5a189a); border: none; font-weight: bold; padding: 12px; border-radius: 8px; color: white; transition: 0.3s; }
        .btn-custom:hover { background: linear-gradient(135deg, #9d4edd, #7b2cbf); transform: translateY(-2px); color: white; }
        .btn-danger-custom { background: #ff3b3b; border: none; font-weight: bold; color: white; border-radius: 8px; }
        .btn-success-custom { background: #00d26a; border: none; font-weight: bold; color: white; border-radius: 8px; padding: 12px; }
        canvas#signature-pad { background-color: #ffffff; border-radius: 10px; width: 100%; height: 250px; border: 2px solid #b066ff; touch-action: none; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid #333333; }
        .table-dark { --bs-table-bg: #141414; --bs-table-border-color: #2a2a2a; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4 p-3">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <img src="https://arkadazzz.github.io/NatProducciones/NAT_Blanco.png" alt="Nat Logo" style="height: 40px; margin-right: 15px;">
            <span style="font-size: 1.2em; font-weight: bold; color: #b066ff;">Acreditación</span>
        </a>
        <button class="btn btn-outline-light btn-sm" id="btnCerrarSesion">Cerrar Sesión</button>
    </div>
</nav>

<div class="container">
    <div class="row">
        <!-- COLUMNA IZQ -->
        <div class="col-lg-5">
            <div class="card-panel" id="seccionConfiguracion">
                <h5>1. Datos del Programa</h5>
                <p class="text-muted" style="font-size: 0.9em;">Define el evento antes de abrir las puertas.</p>
                <input type="text" id="nombrePrograma" class="form-control mb-3" placeholder="Ej: Matinal VIP - 23 Agosto">
                <input type="number" id="montoPago" class="form-control mb-3" placeholder="Monto a pagar ($)">
                <button class="btn btn-custom w-100" id="btnIniciarPuerta">Abrir Puertas (Activar Escáner)</button>
            </div>

            <div class="card-panel d-none" id="seccionEscaner">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">2. Escáner de Ingreso</h5>
                    <span class="badge bg-success" id="indicadorActivo">Grabando</span>
                </div>
                <div id="reader"></div>
                <div id="mensajeEscaneo" class="alert alert-info mt-3 d-none text-center" style="background: #1c103f; border: none; color: #d6b3ff;">Buscando RUT...</div>
            </div>
        </div>

        <!-- COLUMNA DER -->
        <div class="col-lg-7">
            <div class="card-panel d-none" id="seccionFirma">
                <h4 class="text-success mb-1">¡Asistente Encontrado!</h4>
                <h3 id="nombreAsistenteDisplay" class="mb-3 text-white">Juan Pérez</h3>
                
                <div id="zonaFirmaPad">
                    <p class="text-muted mb-2">Firma del trabajador para aceptar Contrato DT y Cesión de Imagen:</p>
                    <canvas id="signature-pad"></canvas>
                    <div class="d-flex justify-content-between mt-3">
                        <button class="btn btn-outline-danger btn-sm" id="btnLimpiarFirma">Borrar Firma</button>
                        <button class="btn btn-success-custom px-4" id="btnGuardarIngreso">Confirmar y Guardar Asistencia</button>
                    </div>
                </div>
            </div>

            <div class="card-panel" id="seccionLista">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5>Asistentes (<span id="contadorAsistentes">0</span>)</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-success btn-sm fw-bold" id="btnExcelBanco">🏦 Banco (Día)</button>
                        <button class="btn btn-warning btn-sm fw-bold text-dark" id="btnExcelContador">📊 Contador (Mes)</button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                            <tr><th>Nombre</th><th>Hora</th><th>Tipo</th><th>Acción</th></tr>
                        </thead>
                        <tbody id="tablaAsistentes"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
