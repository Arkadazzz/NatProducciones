<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acreditación | Nat Producciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: 'Segoe UI', system-ui, sans-serif; padding-bottom: 50px; }
        .card-panel { background: #141414; border-radius: 15px; border: 1px solid #2a2a2a; padding: 25px; margin-top: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-control, .form-select { background-color: #222222 !important; border: 1px solid #444444 !important; color: #ffffff !important; border-radius: 8px; }
        .form-control:focus, .form-select:focus { border-color: #b066ff !important; box-shadow: 0 0 8px rgba(176, 102, 255, 0.5) !important; }
        .btn-custom { background: linear-gradient(135deg, #7b2cbf, #5a189a); border: none; font-weight: bold; padding: 14px; border-radius: 8px; color: white; transition: 0.3s; width: 100%; font-size: 1.2em; }
        .btn-custom:hover { background: linear-gradient(135deg, #9d4edd, #7b2cbf); transform: translateY(-2px); }
        h4, h5 { color: #b066ff; font-weight: 600; }
        .section-title { margin-bottom: 20px; color: #d6b3ff; font-size: 1.3em; }
        .separator { border-top: 2px dashed #333; margin: 30px 0; }
        #qr-container { background: white; padding: 20px; border-radius: 10px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 600px;">
    <div class="text-center mt-4 mb-3">
        <img src="https://arkadazzz.github.io/NatProducciones/NAT_Blanco.png" alt="Nat Logo" style="height: 60px;">
        <h3 class="mt-3 fw-bold" style="color: #b066ff;">Formulario de Acreditación</h3>
        <p class="text-muted">Completa tus datos para ingresar al evento</p>
    </div>

    <div id="form-container" class="card-panel">
        <form id="registroForm">
            
            <!-- SECCIÓN 1: EVENTO -->
            <h5 class="section-title mt-0">🎬 Selección de Evento</h5>
            <div class="row">
                <div class="col-12 mb-3">
                    <label class="form-label text-warning fw-bold">Evento Activo</label>
                    <select id="programaSelect" class="form-select border-warning" required>
                        <option value="">⏳ Buscando eventos...</option>
                    </select>
                </div>
                
                <div class="col-12 mb-3">
                    <label class="form-label text-white fw-bold">Tipo de Ingreso</label>
                    <select id="tipoIngreso" class="form-select" required>
                        <option value="Pago">🎟️ Público General (I/P)</option>
                        <option value="Cortesía">⭐ Invitado de Cortesía</option>
                    </select>
                </div>
            </div>

            <div id="divInvitadoPor" class="mb-3 d-none p-3 rounded" style="background: #1a1400; border: 1px solid #ffcc00;">
                <label class="form-label text-warning fw-bold">¿Quién te invitó?</label>
                <select id="invitadoPor" class="form-select bg-dark text-white border-warning">
                    <option value="">-- Selecciona a quien te invitó --</option>
                    <option value="Luis Jorquera">Luis Jorquera</option>
                    <option value="Agustin Pino">Agustin Pino</option>
                    <option value="Martina Pino">Martina Pino</option>
                    <option value="Ariela Rojas">Ariela Rojas</option>
                    <option value="Javier Rojas">Javier Rojas</option>
                    <option value="Matias Puentes">Matias Puentes</option>
                    <option value="Mario Orbenes">Mario Orbenes</option>
                    <option value="Hana Lizama">Hana Lizama</option>
                    <option value="Fakundo">Fakundo</option>
                    <option value="Karina Abstangen">Karina Abstangen</option>
                </select>
            </div>

            <div id="divPin" class="mb-3 d-none">
                <label class="form-label text-info fw-bold">PIN de Acceso (Entregado por el captador)</label>
                <input type="number" id="pinAcceso" class="form-control border-info text-center fs-4 fw-bold" placeholder="****">
            </div>

            <div class="separator"></div>

            <!-- SECCIÓN 2: DATOS PERSONALES -->
            <h5 class="section-title">👤 Datos Personales</h5>
            <div class="row">
                <div class="col-12 mb-3">
                    <label class="form-label">RUT <small class="text-muted">(Ej: 12345678-9)</small></label>
                    <input type="text" id="rut" class="form-control" required placeholder="12345678-9">
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Nombres</label>
                    <input type="text" id="nombres" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Apellidos</label>
                    <input type="text" id="apellidos" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Fecha Nacimiento</label>
                    <input type="date" id="fechaNac" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" id="telefono" class="form-control" placeholder="912345678" required>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Dirección (Calle, Número, Comuna)</label>
                    <input type="text" id="direccion" class="form-control" required>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Sexo</label>
                    <select id="sexo" class="form-select" required>
                        <option value="">-- Seleccionar --</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
            </div>

            <div class="separator"></div>

            <!-- SECCIÓN 3: DATOS MEDICOS -->
            <h5 class="section-title text-danger">⚕️ Información Médica y Emergencia</h5>
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label text-warning">Contacto Emergencia</label>
                    <input type="text" id="emergenciaNombre" class="form-control border-warning" placeholder="Nombre completo" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label text-warning">Tel. Emergencia</label>
                    <input type="tel" id="emergenciaTelefono" class="form-control border-warning" placeholder="Ej: 912345678" required>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label text-danger">Enfermedades Base / Alergias</label>
                    <input type="text" id="enfermedades" class="form-control border-danger" placeholder="Ej: Asma, Alergias (o 'Ninguna')" required>
                </div>
            </div>

            <div class="separator"></div>

            <!-- SECCIÓN 4: DATOS BANCARIOS -->
            <div id="seccionBancaria">
                <h5 class="section-title text-success">💰 Datos para Pago de Honorarios</h5>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">AFP</label>
                        <select id="afp" class="form-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="No cotizo / No sé">No cotizo / No sé</option>
                            <option value="CAPITAL">Capital</option>
                            <option value="CUPRUM">Cuprum</option>
                            <option value="HABITAT">Habitat</option>
                            <option value="MODELO">Modelo</option>
                            <option value="PLANVITAL">PlanVital</option>
                            <option value="PROVIDA">ProVida</option>
                            <option value="UNO">Uno</option>
                        </select>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Salud (Previsión)</label>
                        <select id="salud" class="form-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="FONASA">Fonasa</option>
                            <option value="BANMEDICA">Banmédica</option>
                            <option value="COLMENA">Colmena</option>
                            <option value="CONSALUD">Consalud</option>
                            <option value="CRUZBLANCA">Cruz Blanca</option>
                            <option value="NUEVAMASVIDA">Nueva Masvida</option>
                            <option value="VIDATRES">Vida Tres</option>
                        </select>
                    </div>
                    <div class="col-12 mb-3">
                        <label class="form-label">Banco</label>
                        <select id="banco" class="form-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="ESTADO">Banco Estado</option>
                            <option value="CHILE">Banco de Chile</option>
                            <option value="BCI">BCI</option>
                            <option value="SANTANDER">Santander</option>
                            <option value="ITAU">Itaú</option>
                            <option value="SCOTIABANK">Scotiabank</option>
                            <option value="BICE">BICE</option>
                            <option value="SECURITY">Security</option>
                            <option value="CONSORCIO">Consorcio</option>
                            <option value="RIPLEY">Ripley</option>
                        </select>
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">Tipo de Cuenta</label>
                        <select id="tipoCuenta" class="form-select" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="CUENTA_RUT">Cuenta RUT</option>
                            <option value="CUENTA_CORRIENTE">Cuenta Corriente</option>
                            <option value="CUENTA_VISTA">Cuenta Vista / Ahorro</option>
                        </select>
                    </div>
                    <div class="col-6 mb-4">
                        <label class="form-label">N° de Cuenta</label>
                        <input type="text" id="numeroCuenta" class="form-control" required>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-custom" id="btnEnviar">ENVIAR REGISTRO 🚀</button>
        </form>
    </div>

    <!-- PANTALLA DE ÉXITO Y QR -->
    <div id="success-container" class="card-panel text-center d-none" style="border-color: #00d26a;">
        <h2 class="text-success fw-bold mb-3">¡Registro Exitoso!</h2>
        <p class="fs-5">Muestra este Código QR en la puerta para ingresar.</p>
        <div id="qr-container"></div>
        <h3 class="mt-4 text-warning fw-bold" id="displayRut"></h3>
        <p class="text-muted mt-4">Toma una captura de pantalla por precaución.</p>
        <button class="btn btn-outline-light mt-3" onclick="window.location.reload()">Registrar a otra persona</button>
    </div>

</div>

<!-- FIREBASE & LOGIC -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, get, set, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5M5p6deAJu4qPeLxy1FdKDNLic5LoVpE",
        authDomain: "natproducciones.firebaseapp.com",
        projectId: "natproducciones",
        storageBucket: "natproducciones.firebasestorage.app",
        messagingSenderId: "553451405946",
        appId: "1:553451405946:web:3a9f5a4a1429466641f1c3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let programasDisponibles = {};

    // 1. CARGAR PROGRAMAS ACTIVOS
    onValue(ref(db, '0_estado_sistema/programas_activos'), (snapshot) => {
        const select = document.getElementById('programaSelect');
        select.innerHTML = '<option value="">-- Selecciona el evento --</option>';
        
        if (snapshot.exists()) {
            programasDisponibles = snapshot.val();
            for (const clave in programasDisponibles) {
                const p = programasDisponibles[clave];
                select.innerHTML += `<option value="${clave}">${p.nombre} (${p.fecha})</option>`;
            }
        } else {
            select.innerHTML = '<option value="">No hay eventos activos en este momento</option>';
        }
    });

    // 2. LÓGICA DE CAMPOS DINÁMICOS
    const tipoIngreso = document.getElementById('tipoIngreso');
    const divInvitadoPor = document.getElementById('divInvitadoPor');
    const divPin = document.getElementById('divPin');
    const programaSelect = document.getElementById('programaSelect');
    const seccionBancaria = document.getElementById('seccionBancaria');
    const invitadoPorInput = document.getElementById('invitadoPor');
    const pinInput = document.getElementById('pinAcceso');
    
    // Elementos Bancarios (para quitar/poner el required)
    const camposBancarios = ['afp', 'salud', 'banco', 'tipoCuenta', 'numeroCuenta'];

    function actualizarFormulario() {
        const progClave = programaSelect.value;
        
        // Bloquear cortesía si es Dale Play
        if (progClave && programasDisponibles[progClave]) {
            if (programasDisponibles[progClave].nombre.includes("Dale Play")) {
                tipoIngreso.value = "Pago";
                tipoIngreso.options[1].disabled = true;
                tipoIngreso.options[1].style.display = "none";
            } else {
                tipoIngreso.options[1].disabled = false;
                tipoIngreso.options[1].style.display = "";
            }
        }
        
        const tipo = tipoIngreso.value;
        
        if (tipo === "Cortesía") {
            divInvitadoPor.classList.remove('d-none');
            invitadoPorInput.required = true;
            
            divPin.classList.add('d-none');
            pinInput.required = false;
            
            // Si es cortesía, no obligar a llenar banco
            seccionBancaria.classList.add('d-none');
            camposBancarios.forEach(id => document.getElementById(id).required = false);
        } else {
            divInvitadoPor.classList.add('d-none');
            invitadoPorInput.required = false;
            
            seccionBancaria.classList.remove('d-none');
            camposBancarios.forEach(id => document.getElementById(id).required = true);
            
            // Si es Pago y el programa tiene PIN, exigirlo
            if (progClave && programasDisponibles[progClave] && programasDisponibles[progClave].pin) {
                divPin.classList.remove('d-none');
                pinInput.required = true;
            } else {
                divPin.classList.add('d-none');
                pinInput.required = false;
            }
        }
    }

    tipoIngreso.addEventListener('change', actualizarFormulario);
    programaSelect.addEventListener('change', actualizarFormulario);

    // FORMATEO DE RUT (Agregar guión automático si no tiene)
    document.getElementById('rut').addEventListener('blur', function(e) {
        let val = this.value.replace(/[^0-9kK]/g, '').toUpperCase();
        if(val.length > 1) {
            val = val.slice(0, -1) + '-' + val.slice(-1);
        }
        this.value = val;
    });

    // 3. ENVIAR FORMULARIO
    document.getElementById('registroForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btnEnviar');
        btn.disabled = true;
        btn.innerText = "PROCESANDO... ⏳";

        try {
            const progClave = programaSelect.value;
            if (!progClave) { alert("Selecciona un evento."); throw new Error(); }
            const prog = programasDisponibles[progClave];

            const rut = document.getElementById('rut').value.trim();
            const tipo = tipoIngreso.value;

            // Validar PIN
            if (tipo === "Pago" && prog.pin) {
                if (pinInput.value !== prog.pin) {
                    alert("❌ PIN INCORRECTO. Pídeselo a tu captador.");
                    pinInput.value = "";
                    throw new Error("PIN Incorrecto");
                }
            }

            // Verificar Blacklist
            const blacklistSnap = await get(child(ref(db), `4_blacklist/${rut}`));
            if (blacklistSnap.exists()) {
                alert("⛔ No puedes registrarte. Tu RUT está bloqueado en el sistema.");
                throw new Error("Blacklist");
            }

            // Limpiar teléfono (Quitar +56)
            let telefonoLimpio = document.getElementById('telefono').value.replace(/^\+56\s*9/, '9').replace(/^\+56/, '9').replace(/\s+/g, '');

            // Guardar en BD (1_trabajadores)
            const datosTrabajador = {
                rut: rut,
                nombres: document.getElementById('nombres').value.toUpperCase(),
                apellidos: document.getElementById('apellidos').value.toUpperCase(),
                fechaNacimiento: document.getElementById('fechaNac').value,
                telefono: telefonoLimpio,
                email: document.getElementById('email').value.toLowerCase(),
                direccion: document.getElementById('direccion').value,
                sexo: document.getElementById('sexo').value,
                emergenciaNombre: document.getElementById('emergenciaNombre').value,
                emergenciaTelefono: document.getElementById('emergenciaTelefono').value,
                enfermedades: document.getElementById('enfermedades').value
            };

            if (tipo === "Pago") {
                datosTrabajador.afp = document.getElementById('afp').value;
                datosTrabajador.salud = document.getElementById('salud').value;
                datosTrabajador.banco = document.getElementById('banco').value;
                datosTrabajador.tipoCuenta = document.getElementById('tipoCuenta').value;
                datosTrabajador.numeroCuenta = document.getElementById('numeroCuenta').value;
            }

            // Auto-fill account number if RUT account
            if (datosTrabajador.tipoCuenta === "CUENTA_RUT" && !datosTrabajador.numeroCuenta) {
                datosTrabajador.numeroCuenta = rut.split('-')[0];
            }

            await set(ref(db, `1_trabajadores/${rut}`), datosTrabajador);

            // Guardar Reserva
            await set(ref(db, `3_reservas/${prog.fecha}/${prog.nombre}/${rut}`), {
                rut: rut,
                tipo: tipo,
                invitado_por: tipo === "Cortesía" ? invitadoPorInput.value : ""
            });

            // ÉXITO -> Mostrar QR
            document.getElementById('form-container').classList.add('d-none');
            document.getElementById('success-container').classList.remove('d-none');
            document.getElementById('displayRut').innerText = rut;
            
            new QRCode(document.getElementById("qr-container"), {
                text: rut,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            // Scroll arriba para que vean el mensaje
            window.scrollTo(0,0);

        } catch (err) {
            btn.disabled = false;
            btn.innerText = "ENVIAR REGISTRO 🚀";
        }
    });
</script>
</body>
</html>
