<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Público | Producción</title>
    <!-- Bootstrap para el diseño profesional y responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .card-form { max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: white; }
        #codigoQR img { margin: 0 auto; } /* Centra el QR */
    </style>
</head>
<body>

<div class="container">
    <div class="card-form">
        <h3 class="text-center mb-4">Registro de Asistencia</h3>
        <p class="text-muted text-center">Ingresa tus datos para la acreditación y pago de tu participación.</p>
        
        <!-- FORMULARIO DE CAPTURA -->
        <form id="formularioRegistro">
            
            <h5 class="mt-4 mb-3">1. Datos Personales</h5>
            <div class="mb-3">
                <label class="form-label">RUT (Ej: 19123456-7)</label>
                <input type="text" class="form-control" id="rut" required placeholder="Ingresa tu RUT">
                <div class="form-text text-primary" id="mensajeAutocompletado"></div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombres</label>
                    <input type="text" class="form-control" id="nombres" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="apellidos" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
            </div>

            <h5 class="mt-4 mb-3">2. Datos Previsionales</h5>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">AFP</label>
                    <select class="form-select" id="afp" required>
                        <option value="">Selecciona...</option>
                        <option value="Capital">Capital</option>
                        <option value="Cuprum">Cuprum</option>
                        <option value="Habitat">Habitat</option>
                        <option value="Modelo">Modelo</option>
                        <option value="PlanVital">PlanVital</option>
                        <option value="ProVida">ProVida</option>
                        <option value="Uno">Uno</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sistema de Salud</label>
                    <select class="form-select" id="salud" required>
                        <option value="">Selecciona...</option>
                        <option value="Fonasa">Fonasa</option>
                        <option value="Isapre">Isapre</option>
                    </select>
                </div>
            </div>

            <h5 class="mt-4 mb-3">3. Datos Bancarios</h5>
            <div class="mb-3">
                <label class="form-label">Banco</label>
                <input type="text" class="form-control" id="banco" required placeholder="Ej: BancoEstado">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo de Cuenta</label>
                    <select class="form-select" id="tipoCuenta" required>
                        <option value="">Selecciona...</option>
                        <option value="Cuenta RUT">Cuenta RUT</option>
                        <option value="Cuenta Corriente">Cuenta Corriente</option>
                        <option value="Cuenta Vista">Cuenta Vista</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Número de Cuenta</label>
                    <input type="number" class="form-control" id="numeroCuenta" required>
                </div>
            </div>

            <!-- CHECKBOX LEGAL -->
            <div class="form-check mt-4 mb-4">
                <input class="form-check-input" type="checkbox" id="aceptoTerminos" required>
                <label class="form-check-label text-muted" style="font-size: 0.9em;" for="aceptoTerminos">
                    Acepto los términos y el tratamiento de mis datos personales para fines de remuneración, acreditación de acceso y generación de contratos laborales (Ley N° 19.628).
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2">Confirmar y Generar Entrada</button>
        </form>
        
        <!-- CONTENEDOR DEL CÓDIGO QR (Oculto por defecto) -->
        <div id="contenedorQR" class="text-center mt-4 d-none">
            <h4 class="text-success fw-bold">¡Registro Exitoso!</h4>
            <p class="mb-4">Toma una captura de pantalla a este código y muéstralo en la entrada del canal.</p>
            <div id="codigoQR" class="d-flex justify-content-center bg-light p-3 border rounded"></div>
        </div>

    </div>
</div>

<!-- LIBRERÍAS Y SCRIPTS -->
<!-- Librería para generar el Código QR -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Tu archivo JavaScript principal (type="module" es obligatorio para Firebase) -->
<script type="module" src="app.js"></script>

</body>
</html>
