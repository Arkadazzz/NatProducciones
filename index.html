<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Nat Producciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; }
        .card-registro { background: #141414; border: 1px solid #2a2a2a; border-radius: 15px; padding: 30px; margin-top: 30px; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(138, 43, 226, 0.1); }
        .form-control, .form-select { background-color: #222222; border: 1px solid #333333; color: #ffffff; }
        .form-control:focus, .form-select:focus { border-color: #b066ff; background-color: #222222; color: #ffffff; box-shadow: none; }
        .btn-primary { background: linear-gradient(135deg, #7b2cbf, #5a189a); border: none; padding: 12px; font-weight: bold; text-transform: uppercase; }
        .btn-primary:hover { background: linear-gradient(135deg, #9d4edd, #7b2cbf); transform: translateY(-2px); transition: 0.3s; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="col-md-8 col-lg-6 card-registro">
        <div class="text-center mb-4">
            <img src="https://arkadazzz.github.io/NatProducciones/NAT_Blanco.png" alt="Nat Producciones" style="max-width: 200px; margin-bottom: 15px;">
            <h4 id="encabezadoFormulario" style="color: #b066ff;">Registro de Asistentes</h4>
        </div>

        <form id="formularioRegistro">
            <div class="mb-3">
                <label class="form-label">RUT (sin puntos, con guion)</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="rut" required placeholder="Ej: 12345678-9">
                    <button type="button" class="btn btn-outline-light" id="btnVerificarRut">Continuar</button>
                </div>
            </div>

            <div id="camposExtras" class="d-none">
                <h5 class="mt-4 mb-3" style="color: #d6b3ff; border-bottom: 1px solid #333; padding-bottom: 10px;">Datos Personales</h5>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text" class="form-control" id="nombres">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="apellidos">
                    </div>
                </div>

                <!-- NUEVOS CAMPOS AÑADIDOS AQUÍ -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Fecha de Nacimiento</label>
                        <input type="date" class="form-control" id="fechaNacimiento">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Sexo</label>
                        <select class="form-select" id="sexo">
                            <option value="">Selecciona...</option>
                            <option value="M">Masculino (M)</option>
                            <option value="F">Femenino (F)</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirección Completa</label>
                    <input type="text" class="form-control" id="direccion" placeholder="Ej: Ernesto Hevia 5880, La Reina">
                </div>
                <!-- FIN NUEVOS CAMPOS -->

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" placeholder="+569...">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com">
                    </div>
                </div>

                <h5 class="mt-4 mb-3" style="color: #d6b3ff; border-bottom: 1px solid #333; padding-bottom: 10px;">Datos de Contratación y Pago</h5>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">AFP</label>
                        <select class="form-select" id="afp">
                            <option value="">Selecciona...</option>
                            <option value="CAPITAL">Capital</option>
                            <option value="CUPRUM">Cuprum</option>
                            <option value="HABITAT">Habitat</option>
                            <option value="MODELO">Modelo</option>
                            <option value="PLANVITAL">PlanVital</option>
                            <option value="PROVIDA">ProVida</option>
                            <option value="UNO">Uno</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Salud</label>
                        <select class="form-select" id="salud">
                            <option value="">Selecciona...</option>
                            <option value="FONASA">Fonasa</option>
                            <option value="BANMEDICA">Banmédica</option>
                            <option value="COLMENA">Colmena</option>
                            <option value="CONSALUD">Consalud</option>
                            <option value="CRUZBLANCA">Cruz Blanca</option>
                            <option value="NUEVAMASVIDA">Nueva Masvida</option>
                            <option value="VIDATRES">Vida Tres</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Banco</label>
                    <select class="form-select" id="banco">
                        <option value="">Selecciona...</option>
                        <option value="ESTADO">Banco Estado</option>
                        <option value="CHILE">Banco de Chile</option>
                        <option value="BCI">BCI</option>
                        <option value="SANTANDER">Santander</option>
                        <option value="ITAU">Itaú</option>
                        <option value="SCOTIABANK">Scotiabank</option>
                        <option value="FALABELLA">Falabella</option>
                        <option value="BICE">BICE</option>
                        <option value="SECURITY">Security</option>
                        <option value="CONSORCIO">Consorcio</option>
                        <option value="RIPLEY">Ripley</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tipo de Cuenta</label>
                        <select class="form-select" id="tipoCuenta">
                            <option value="">Selecciona...</option>
                            <option value="CUENTA_RUT">Cuenta RUT</option>
                            <option value="CUENTA_CORRIENTE">Cuenta Corriente</option>
                            <option value="CUENTA_VISTA">Cuenta Vista / Ahorro</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Número de Cuenta</label>
                        <input type="text" class="form-control" id="numeroCuenta">
                    </div>
                </div>

                <div class="form-check mt-3 mb-4">
                    <input class="form-check-input" type="checkbox" id="aceptoTerminos" required>
                    <label class="form-check-label text-muted" for="aceptoTerminos" style="font-size: 0.85em;">
                        Acepto el uso de mis datos para fines de acreditación, contrato y remuneraciones por parte de Nat Producciones.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3">Guardar Datos y Generar QR</button>
            </div>
        </form>

        <div id="contenedorQR" class="text-center d-none mt-4">
            <h4 class="text-success mb-3" id="mensajeExito">¡Registro Exitoso!</h4>
            <p class="text-muted">Presenta este código en la entrada:</p>
            <div id="codigoQR" class="d-inline-block bg-white p-3 rounded shadow"></div>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
